<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#1a73b5"/>
    <title>Sin conexión - Soporte GrupoSur</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f7f8fa;
            --text: #1e293b;
            --text-muted: #64748b;
            --primary: #1a73b5;
            --primary-hover: #155d94;
            --card-bg: #ffffff;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #e2e8f0;
                --text-muted: #94a3b8;
                --primary: #38bdf8;
                --primary-hover: #7dd3fc;
                --card-bg: #1e293b;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .offline-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 3rem 2rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .offline-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .btn:hover, .btn:focus-visible {
            background: var(--primary-hover);
        }

        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="offline-card" role="alert">
        <span class="offline-icon" aria-hidden="true">&#128268;</span>
        <h1>Sin conexión</h1>
        <p>Verifica tu conexión a internet e intenta de nuevo.</p>
        <button class="btn" onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
