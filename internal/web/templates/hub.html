{{define "content"}}
<div class="hub">
  <h1>Hola{{if .User.Name}}, {{.User.Name}}{{end}}</h1>
  <p class="lead">Elegí un módulo para continuar.</p>

  {{if .Modules}}
  <div class="cards">
    {{range .Modules}}
    <a class="card" href="{{.URL}}">
      <h2>{{.Name}}</h2>
      <p>{{.Desc}}</p>
      <span class="card-go">Entrar →</span>
    </a>
    {{end}}
  </div>
  {{else}}
  <div class="empty-state">
    <p>No tenés módulos asignados todavía.</p>
    <p class="muted">Pedile a un administrador que te habilite el acceso.</p>
  </div>
  {{end}}
</div>
{{end}}
